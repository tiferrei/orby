name: Check Orby

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      - run: nix flake check --all-systems --no-build
      - name: Test OrbStack lifecycle
        working-directory: pkgs/orby-runner
        run: nix shell nixpkgs#go --command env CGO_ENABLED=0 go test ./...
