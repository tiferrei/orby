name: Check Orby

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      - run: nix flake check --all-systems --no-build

  runner-tests:
    runs-on: macos-15-arm
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: pkgs/orby/go.mod
      - name: Test runner and fake orbctl interaction
        working-directory: pkgs/orby
        run: go test -race ./...
